version: '3.8'

services:
  prism-gateway:
    build: 
      context: ./apps/gateway
      dockerfile: Dockerfile
    container_name: prism-gateway
    ports:
      - "8080:8080"
    environment:
      - REDIS_ADDR=prism-redis:6379
      - DB_URL=postgres://postgres:prism@prism-db:5432/prism?sslmode=disable
      - S3_ENDPOINT=http://prism-minio:9000
      - S3_REGION=us-east-1
      - S3_BUCKET=raw-documents
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    depends_on:
      - prism-redis
      - prism-db
      - prism-minio
    networks:
      - prism-network

  prism-worker:
    build: 
      context: ./apps/worker
      dockerfile: Dockerfile
    container_name: prism-worker
    environment:
      - REDIS_ADDR=prism-redis:6379
      - DB_URL=postgres://postgres:prism@prism-db:5432/prism
      - S3_ENDPOINT=http://prism-minio:9000
      - S3_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      - prism-redis
      - prism-db
      - prism-minio
    networks:
      - prism-network

  prism-web:
    build: 
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: prism-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - prism-gateway
    networks:
      - prism-network
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next

  prism-redis:
    image: redis:7-alpine
    container_name: prism-redis
    ports:
      - "6379:6379"
    networks:
      - prism-network
    volumes:
      - redis_data:/data

  prism-db:
    image: postgres:15-alpine
    container_name: prism-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=prism
      - POSTGRES_DB=prism
    networks:
      - prism-network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  prism-minio:
    image: minio/minio
    container_name: prism-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    networks:
      - prism-network
    volumes:
      - minio_data:/data

networks:
  prism-network:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
  minio_data:
