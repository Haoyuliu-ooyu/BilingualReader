version: '3.8'

services:
  prism-gateway:
    build: 
      context: ./apps/gateway
      dockerfile: Dockerfile
    container_name: prism-gateway
    ports:
      - "8080:8080"
    env_file:
      - .env.dev
      - .env

  prism-worker:
    build: 
      context: ./apps/worker
      dockerfile: Dockerfile
    container_name: prism-worker
    env_file:
      - .env.dev
      - .env

  prism-web:
    build: 
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: prism-web
    ports:
      - "3000:3000"
    env_file:
      - .env.dev
